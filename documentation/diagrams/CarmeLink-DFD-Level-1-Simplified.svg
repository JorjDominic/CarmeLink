 y="332.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Account data</ns0:text><ns0:rect x="1006.4" y="390.5" width="117.2" height="19" fill="white" /><ns0:text x="1065" y="404.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Account updates</ns0:text><ns0:rect x="190.0" y="460.5" width="190.0" height="19" fill="white" /><ns0:text x="285" y="474.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Record / payment requests</ns0:text><ns0:rect x="240.0" y="505.5" width="190.0" height="19" fill="white" /><ns0:text x="335" y="519.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Records / payment results</ns0:text><ns0:rect x="685.44" y="460.5" width="219.12" height="19" fill="white" /><ns0:text x="795" y="474.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Reports / messages / requests</ns0:text><ns0:rect x="731.8" y="505.5" width="226.4" height="19" fill="white" /><ns0:text x="845" y="519.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Decisions / messages / notices</ns0:text><ns0:rect x="1188.16" y="460.5" width="233.68" height="19" fill="white" /><ns0:text x="1305" y="474.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Device events / curfew requests</ns0:text><ns0:rect x="1260.0" y="505.5" width="190.0" height="19" fill="white" /><ns0:text x="1355" y="519.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Presence / curfew results</ns0:text><ns0:rect x="106.4" y="728.5" width="117.2" height="19" fill="white" /><ns0:text x="165" y="742.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Updated records</ns0:text><ns0:rect x="363.68" y="750.5" width="102.64" height="19" fill="white" /><ns0:text x="415" y="764.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Recorded data</ns0:text><ns0:rect x="616.4" y="728.5" width="117.2" height="19" fill="white" /><ns0:text x="675" y="742.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Updated records</ns0:text><ns0:rect x="873.68" y="750.5" width="102.64" height="19" fill="white" /><ns0:text x="925" y="764.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Recorded data</ns0:text><ns0:rect x="1126.4" y="728.5" width="117.2" height="19" fill="white" /><ns0:text x="1185" y="742.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Updated records</ns0:text><ns0:rect x="1383.68" y="750.5" width="102.64" height="19" fill="white" /><ns0:text x="1435" y="764.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Recorded data</ns0:text><ns0:rect x="482.28" y="780.5" width="175.44" height="19" fill="white" /><ns0:text x="570" y="794.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Operational report data</ns0:text><ns0:rect x="790.48" y="700.5" width="139.04" height="19" fill="white" /><ns0:text x="860" y="714.76" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Curfew report data</ns0:text><ns0:text x="800.0" y="35.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400">Level 1 - CarmeLink Data Flow Diagram</ns0:text><ns0:text x="215.0" y="120.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Tenant</ns0:text><ns0:text x="605.0" y="120.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Authorized Guardian</ns0:text><ns0:text x="995.0" y="120.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Owner</ns0:text><ns0:text x="1385.0" y="120.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Authorized Caretaker</ns0:text><ns0:text x="800.0" y="343.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">1. Manage Access and User Requests</ns0:text><ns0:text x="800.0" y="365.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">Authenticate users, check permissions</ns0:text><ns0:text x="800.0" y="387.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">and route requests or device events</ns0:text><ns0:text x="290.0" y="598.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">2. Manage Records and Billing</ns0:text><ns0:text x="290.0" y="620.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">Tenants, rooms, contracts, payments,</ns0:text><ns0:text x="290.0" y="642.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">deposits, PDF reports and analytics</ns0:text><ns0:text x="800.0" y="598.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">3. Manage Requests and Communication</ns0:text><ns0:text x="800.0" y="620.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">Maintenance, visitors, cleaning, cases,</ns0:text><ns0:text x="800.0" y="642.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">appeals, messages and announcements</ns0:text><ns0:text x="1310.0" y="598.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">4. Process Geofencing and Curfew</ns0:text><ns0:text x="1310.0" y="620.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">Entry / exit events, presence,</ns0:text><ns0:text x="1310.0" y="642.78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400">exceptions, acknowledgments and alerts</ns0:text><ns0:text x="800.0" y="990.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400">Each role appears once. Requests and results pass through the shared access process.</ns0:text><ns0:text x="800.0" y="1010.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400">Permissions still apply: guardians access linked tenants and acknowledge overnight leave only.</ns0:text><ns0:text x="800.0" y="1030.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400">Tenant smartphones supply geofencing events; owner-only functions remain restricted.</ns0:text><ns0:text x="800.0" y="1050.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400">Data stores group related records. Uploaded files remain linked to the appropriate records.</ns0:text><ns0:line x1="1188" y1="325" x2="1188" y2="395" stroke="#333" stroke-width="1.4" /><ns0:text x="1164" y="366.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">D1</ns0:text><ns0:text x="1344.0" y="366.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">User Accounts and Roles</ns0:text><ns0:line x1="158" y1="820" x2="158" y2="900" stroke="#333" stroke-width="1.4" /><ns0:text x="134" y="866.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">D2</ns0:text><ns0:text x="314.0" y="855.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Tenant, Room, Contract,</ns0:text><ns0:text x="314.0" y="877.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Billing and Deposit Records</ns0:text><ns0:line x1="668" y1="820" x2="668" y2="900" stroke="#333" stroke-width="1.4" /><ns0:text x="644" y="866.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">D3</ns0:text><ns0:text x="824.0" y="855.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Operational Requests, Cases,</ns0:text><ns0:text x="824.0" y="877.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Messages and Announcement Records</ns0:text><ns0:line x1="1178" y1="820" x2="1178" y2="900" stroke="#333" stroke-width="1.4" /><ns0:text x="1154" y="866.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">D4</ns0:text><ns0:text x="1334.0" y="855.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Presence, Gate Activity,</ns0:text><ns0:text x="1334.0" y="877.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">Curfew and Exception Records</ns0:text></ns0:svg>