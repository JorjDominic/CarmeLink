am</text><text x="800.0" y="450.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">0</text><text x="800.0" y="476.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">CarmeLink</text><text x="800.0" y="502.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Dormitory Management System</text><text x="800.0" y="528.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">with Geofencing-Based</text><text x="800.0" y="554.48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700">Curfew Monitoring</text><text x="175.0" y="266.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Tenant</text><text x="175.0" y="766.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Authorized Guardian</text><text x="1425.0" y="266.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Owner</text><text x="1425.0" y="766.12" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Authorized Caretaker</text><text x="800.0" y="962.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400">Four external roles: Tenant, Authorized Guardian, Owner and Authorized Caretaker.</text><text x="800.0" y="982.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400">Access follows role permissions; guardians access linked tenants only.</text><text x="800.0" y="1002.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400">Recorded geofence status describes the smartphone and does not independently confirm a violation.</text></svg>