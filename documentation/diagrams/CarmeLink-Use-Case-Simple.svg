<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1100" height="1540" viewBox="0 0 1100 1540"><ns0:rect width="1100" height="1540" fill="white" /><ns0:text x="550" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">CarmeLink Use Case Diagram</ns0:text><ns0:path d="M 950 240 L 730 1134" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 102" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 102" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 102" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 102" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 188" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 188" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 188" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 188" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 274" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 274" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 274" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 274" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 360" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 360" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 446" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 446" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 446" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 446" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 532" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 618" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 618" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 704" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 790" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 790" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 876" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 962" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 962" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 962" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 1048" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 1048" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 1048" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 1048" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 1220.0" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 1306.0" fill="none" stroke="#999" /><ns0:path d="M 140 1100 L 370 1306.0" fill="none" stroke="#999" /><ns0:path d="M 950 240 L 730 1306.0" fill="none" stroke="#999" /><ns0:path d="M 950 1100 L 730 1306.0" fill="none" stroke="#999" /><ns0:path d="M 140 240 L 370 1392.0" fill="none" stroke="#999" /><ns0:circle cx="110" cy="200" r="10" fill="white" stroke="#222" /><ns0:path d="M 110 210 V 255 M 85 228 H 135 M 85 285 L 110 255 L 135 285" fill="none" stroke="#222" stroke-width="2" /><ns0:text x="110" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Owner</ns0:text><ns0:circle cx="110" cy="1060" r="10" fill="white" stroke="#222" /><ns0:path d="M 110 1070 V 1115 M 85 1088 H 135 M 85 1145 L 110 1115 L 135 1145" fill="none" stroke="#222" stroke-width="2" /><ns0:text x="110" y="1175" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Caretaker</ns0:text><ns0:circle cx="980" cy="200" r="10" fill="white" stroke="#222" /><ns0:path d="M 980 210 V 255 M 955 228 H 1005 M 955 285 L 980 255 L 1005 285" fill="none" stroke="#222" stroke-width="2" /><ns0:text x="980" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Tenant</ns0:text><ns0:circle cx="980" cy="1060" r="10" fill="white" stroke="#222" /><ns0:path d="M 980 1070 V 1115 M 955 1088 H 1005 M 955 1145 L 980 1115 L 1005 1145" fill="none" stroke="#222" stroke-width="2" /><ns0:text x="980" y="1175" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Guardian</ns0:text><ns0:ellipse cx="550" cy="102" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="108.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Log in / Log out</ns0:text><ns0:ellipse cx="550" cy="188" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="194.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">View dashboard and notifications</ns0:text><ns0:ellipse cx="550" cy="274" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="268.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">View permitted tenant and room</ns0:text><ns0:text x="550" y="291.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">records</ns0:text><ns0:ellipse cx="550" cy="360" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="366.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Manage tenancy and facilities</ns0:text><ns0:ellipse cx="550" cy="446" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="452.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">View billing and payment records</ns0:text><ns0:ellipse cx="550" cy="532" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="538.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Submit payment proof</ns0:text><ns0:ellipse cx="550" cy="618" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="624.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Manage charges and verify payments</ns0:text><ns0:ellipse cx="550" cy="704" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="698.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Submit maintenance reports and</ns0:text><ns0:text x="550" y="721.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">concerns</ns0:text><ns0:ellipse cx="550" cy="790" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="796.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Review reports and conduct cases</ns0:text><ns0:ellipse cx="550" cy="876" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="882.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Submit visitor and curfew requests</ns0:text><ns0:ellipse cx="550" cy="962" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="968.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Review visitor and curfew requests</ns0:text><ns0:ellipse cx="550" cy="1048" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="1054.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">View geofencing and curfew status</ns0:text><ns0:ellipse cx="550" cy="1220.0" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="1226.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Submit case responses and appeals</ns0:text><ns0:ellipse cx="550" cy="1306.0" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="1300.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Use private messages and</ns0:text><ns0:text x="550" y="1323.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">announcements</ns0:text><ns0:ellipse cx="550" cy="1392.0" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="1386.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">Generate reports and view</ns0:text><ns0:text x="550" y="1409.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400">analytics</ns0:text><ns0:text x="550" y="1466.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Access follows role permissions; tenants view own records and guardians view linked records.</ns0:text><ns0:text x="550" y="1489.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400">Guardian acknowledgment applies to overnight leave only. Owner-only functions remain restricted.</ns0:text><ns0:ellipse cx="550" cy="1134" rx="180" ry="32" fill="white" stroke="#222" /><ns0:text x="550" y="1128" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Record entry and exit</ns0:text><ns0:text x="550" y="1151" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">through geofencing</ns0:text></ns0:svg>