workflows:
  ios-signed:
    name: CarmeLink iOS Signed Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - carmelink_app_store
        certificates:
          - carmelink_distribution

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
