workflows:
  ios-unsigned:
    name: Carmelita iOS Unsigned Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Create IPA container
        script: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Carmelitas_Dormitory.ipa Payload
          test -f Carmelitas_Dormitory.ipa

    artifacts:
      - build/ios/ipa/Carmelitas_Dormitory.ipa
